<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" width="100%" height="360" fill="none">
  <defs>
    <!-- Background Gradients -->
    <linearGradient id="bg-grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0f1d" />
      <stop offset="50%" stop-color="#0e172a" />
      <stop offset="100%" stop-color="#161233" />
    </linearGradient>
    
    <linearGradient id="primary-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38bdf8" />
      <stop offset="50%" stop-color="#818cf8" />
      <stop offset="100%" stop-color="#c084fc" />
    </linearGradient>

    <linearGradient id="accent-cyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#3b82f6" stop-opacity="0.8"/>
    </linearGradient>

    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ec4899" stop-opacity="0.7"/>
    </linearGradient>

    <linearGradient id="accent-orange" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.7"/>
      <stop offset="100%" stop-color="#ef4444" stop-opacity="0.7"/>
    </linearGradient>

    <!-- Grid Pattern -->
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M 40 0 L 0 0 0 40" fill="none" stroke="#334155" stroke-width="0.75" stroke-opacity="0.25"/>
    </pattern>

    <!-- Filters -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <filter id="badge-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <style>
      .bg-grid { animation: pulseGrid 6s ease-in-out infinite alternate; }
      .float-pill-1 { animation: floatPill1 8s ease-in-out infinite alternate; }
      .float-pill-2 { animation: floatPill2 7s ease-in-out infinite alternate; }
      .float-pill-3 { animation: floatPill3 9s ease-in-out infinite alternate; }
      .float-pill-4 { animation: floatPill4 6.5s ease-in-out infinite alternate; }
      .pulse-ring { animation: pulseRing 3s cubic-bezier(0.4, 0, 0.6, 1) infinite; transform-origin: center; }
      .flow-dash { stroke-dasharray: 8, 8; animation: dashAnim 20s linear infinite; }

      @keyframes pulseGrid {
        0% { opacity: 0.3; }
        100% { opacity: 0.6; }
      }
      @keyframes floatPill1 {
        0% { transform: translate(0px, 0px); }
        100% { transform: translate(25px, -15px); }
      }
      @keyframes floatPill2 {
        0% { transform: translate(0px, 0px); }
        100% { transform: translate(-20px, 18px); }
      }
      @keyframes floatPill3 {
        0% { transform: translate(0px, 0px); }
        100% { transform: translate(15px, 20px); }
      }
      @keyframes floatPill4 {
        0% { transform: translate(0px, 0px); }
        100% { transform: translate(-18px, -14px); }
      }
      @keyframes dashAnim {
        to { stroke-dashoffset: -320; }
      }
      @keyframes pulseRing {
        0% { transform: scale(0.95); opacity: 0.7; }
        50% { transform: scale(1.05); opacity: 0.3; }
        100% { transform: scale(0.95); opacity: 0.7; }
      }
    </style>
  </defs>

  <!-- Background Base -->
  <rect width="1200" height="360" rx="16" fill="url(#bg-grad)"/>
  
  <!-- Subtle Grid Lines -->
  <rect width="1200" height="360" rx="16" fill="url(#grid)" class="bg-grid"/>

  <!-- Dynamic Ambient Animated Background Elements (in deep background) -->
  <g opacity="0.35">
    <circle cx="150" cy="80" r="120" fill="url(#accent-purple)" filter="url(#glow)"/>
    <circle cx="1050" cy="280" r="140" fill="url(#accent-cyan)" filter="url(#glow)"/>
    <circle cx="950" cy="70" r="100" fill="url(#accent-orange)" filter="url(#glow)"/>
  </g>

  <!-- Dynamic Animated Network Connection Curves (Flow lines) -->
  <g fill="none" opacity="0.4">
    <path d="M 120 280 C 350 320, 450 180, 700 240 S 1000 120, 1120 180" stroke="url(#primary-grad)" stroke-width="2" class="flow-dash"/>
    <path d="M 80 120 C 280 40, 520 140, 800 60 S 1050 200, 1150 140" stroke="#818cf8" stroke-width="1.5" stroke-opacity="0.5" class="flow-dash"/>
  </g>

  <!-- Dynamic Floating Feature Pills (Kept at edges so title/subtitle stay 100% unobstructed) -->
  <!-- Top Left Pill: Multi-Platform -->
  <g class="float-pill-1" transform="translate(60, 45)">
    <rect width="180" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#38bdf8" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="6" fill="#38bdf8"/>
    <text x="36" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">MULTI-PLATFORM</text>
  </g>

  <!-- Bottom Left Pill: Open-Source -->
  <g class="float-pill-2" transform="translate(70, 275)">
    <rect width="190" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#10b981" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="6" fill="#10b981"/>
    <text x="36" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">SELF-HOSTED &amp; OSS</text>
  </g>

  <!-- Top Right Pill: Content Calendar -->
  <g class="float-pill-3" transform="translate(940, 45)">
    <rect width="195" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#c084fc" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="6" fill="#c084fc"/>
    <text x="36" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">CONTENT CALENDARS</text>
  </g>

  <!-- Bottom Right Pill: AI Agents & MCP -->
  <g class="float-pill-4" transform="translate(930, 275)">
    <rect width="200" height="36" rx="18" fill="#1e293b" fill-opacity="0.8" stroke="#f59e0b" stroke-opacity="0.4" stroke-width="1.5"/>
    <circle cx="20" cy="18" r="6" fill="#f59e0b"/>
    <text x="36" y="23" fill="#e2e8f0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="600" letter-spacing="0.5">AI AGENTS &amp; MCP READY</text>
  </g>

  <!-- Central Foreground Content Container (Clean & Perfectly Legible) -->
  <!-- Category Badge -->
  <g transform="translate(600, 92)" text-anchor="middle">
    <rect x="-140" y="-15" width="280" height="30" rx="15" fill="#312e81" fill-opacity="0.6" stroke="#818cf8" stroke-width="1"/>
    <text y="5" fill="#a5b4fc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="1.5">CURATED AWESOME ECOSYSTEM</text>
  </g>

  <!-- Main Title -->
  <text x="600" y="165" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="40" font-weight="800" fill="url(#primary-grad)" letter-spacing="-0.5">
    Social Media Management &amp; Publishing
  </text>

  <!-- Subtitle -->
  <text x="600" y="210" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="17" font-weight="400" fill="#94a3b8">
    Multi-Platform Schedulers, Unified Social Inboxes &amp; Self-Hosted Open-Source Alternatives
  </text>

  <!-- Feature Pills Row under Subtitle -->
  <g transform="translate(600, 248)" text-anchor="middle">
    <text y="0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif" font-size="13" font-weight="500" fill="#64748b">
      SaaS Enterprise Benchmarks • Production-Ready Self-Hosted Engines • AI Agent Integrations
    </text>
  </g>

</svg>
